project:
  type: website
  output-dir: docs
  resources:
    - .nojekyll
  # Modules are listed explicitly rather than discovered, so that the 2023 .Rmd
  # files still in vignettes/ are not picked up by the render. Add each new
  # module here, and to the sidebar below and the table in index.qmd; missing
  # one of the three leaves the module unreachable.
  render:
    - index.qmd
    - vignettes/0Software-setup.qmd
    - vignettes/1Software-stack.qmd
    - vignettes/2Fitting-a-CR-model-using-bayesnec.qmd
    - vignettes/3Toxicity_estimation_and_available_models.qmd
    - vignettes/4Model_averaging_and_multimodel_inference.qmd
    - vignettes/5Response_data_and_statistical_distributions.qmd
    - vignettes/6Priors_and_Bayesian_inference.qmd
    - vignettes/7Example_case_study.qmd
    - vignettes/8Factor_covariates_and_groupings.qmd
    - vignettes/drc-reference.qmd

# Chunk output is stored under _freeze/ and committed. The Bayesian fits take
# minutes to hours and need a Stan toolchain, so the site must be rebuildable
# without re-running them. This is also why the site is rendered locally and
# the built output published, rather than rendered by CI.
execute:
  freeze: auto

website:
  title: "Concentration-response modelling"
  description: "Estimating no-effect toxicity values from concentration-response data in R"
  site-url: "https://open-aims.github.io/cr_modelling_training/"
  repo-url: "https://github.com/open-AIMS/cr_modelling_training"
  repo-actions: [issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: vignettes/0Software-setup.qmd
        text: Setup
      - href: vignettes/1Software-stack.qmd
        text: Modules
    right:
      - icon: github
        href: https://github.com/open-AIMS/cr_modelling_training/issues
        text: "Questions and corrections"
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Overview
      - section: "Before you start"
        contents:
          - href: vignettes/0Software-setup.qmd
            text: Software setup
      - section: "Modules"
        contents:
          - href: vignettes/1Software-stack.qmd
            text: "1. The software stack"
          - href: vignettes/2Fitting-a-CR-model-using-bayesnec.qmd
            text: "2. Fitting a single model"
          - href: vignettes/3Toxicity_estimation_and_available_models.qmd
            text: "3. Toxicity estimation and the model set"
          - href: vignettes/4Model_averaging_and_multimodel_inference.qmd
            text: "4. Model averaging"
          - href: vignettes/5Response_data_and_statistical_distributions.qmd
            text: "5. Response data and distributions"
          - href: vignettes/6Priors_and_Bayesian_inference.qmd
            text: "6. Priors and Bayesian inference"
          - href: vignettes/7Example_case_study.qmd
            text: "7. A worked case study"
          - href: vignettes/8Factor_covariates_and_groupings.qmd
            text: "8. Factor covariates and groupings"
      - section: "Frequentist comparison"
        contents:
          - href: vignettes/drc-reference.qmd
            text: "Fitting the same models with drc"
  page-footer:
    left: "Australian Institute of Marine Science"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap

bibliography: vignettes/bayesnec.bib
